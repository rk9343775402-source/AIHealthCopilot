services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-health-postgres
    environment:
      POSTGRES_DB: ai_health_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_health_copilot"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    container_name: ai-health-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project-root .env}@postgres:5432/ai_health_copilot"
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-https://api.omniroute.ai/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: /app/data/uploads
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,https://aihealthcopilot.onrender.com}
    ports:
      - "8000:8000"
    volumes:
      - health_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 10s
      timeout: 3s
      retries: 12
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: ai-health-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
volumes:
  pgdata:
  health_uploads:
